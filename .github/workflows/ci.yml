name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  shell:
    name: Shell scripts and systemd unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck the install scripts
        run: shellcheck scripts/*.sh

      - name: Validate the systemd unit
        run: |
          # systemd-analyze checks that ExecStart actually exists, so point it
          # at the runner's real node rather than a hardcoded path.
          sed -e "s|__NODE_BIN__|$(command -v node)|g" \
              -e 's|__PREFIX__|/opt/uptime-sentinel|g' \
              -e 's|__DATADIR__|/var/lib/uptime-sentinel|g' \
              -e 's|__CONFDIR__|/etc/uptime-sentinel|g' \
              -e 's|__USER__|uptime-sentinel|g' \
              -e 's|__PROTECT_HOME__|yes|g' \
              packaging/uptime-sentinel.service > /tmp/uptime-sentinel.service
          ! grep -q '__' /tmp/uptime-sentinel.service
          systemd-analyze verify /tmp/uptime-sentinel.service

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64 + arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
